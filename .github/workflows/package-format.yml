name: Build and test the per-architecture OpenWrt packages
on:
  workflow_call:
    inputs:
      format:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Build per-architecture installers and upgrade fixtures
    runs-on: ubuntu-latest
    # Runs take under two minutes; the bound leaves room for retried pulls.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Use the version CI worked out
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist/runtime
      # Package revisions count up within a version: a push to develop builds preview N as
      # version-rN, and main builds the release as the next revision after the last preview,
      # so every build upgrades the one before it.
      - name: Number the preview and the release revision
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          . packaging/openwrt/retry.sh
          version=$(cat VERSION)
          last=$(retry gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v$version-preview.\")) | ltrimstr(\"v$version-preview.\") | select(test(\"^[0-9]+\$\")) | tonumber] | max // 0")
          if [ "$DEVELOP" = true ]; then echo "number=$((last + 1))" >> "$GITHUB_OUTPUT"; fi
          echo "revision=$((last + 1))" >> "$GITHUB_OUTPUT"
      - name: Package one installer per OpenWrt architecture
        env:
          OPENWEIR_PACKAGE_PRERELEASE: ${{ steps.preview.outputs.number }}
          OPENWEIR_PACKAGE_REVISION: ${{ steps.preview.outputs.revision }}
          FORMAT: ${{ inputs.format }}
          OPENWEIR_FEED_MODE: test
          OPENWEIR_RUNTIME_DIR: dist/runtime
          OPENWEIR_MIHOMO_PUBLIC_KEY: ${{ vars.MIHOMO_PUBLISHER_KEY }}
        run: |
          case "$FORMAT" in ipk) sdk=24.10.8;; apk) sdk=25.12.6;; *) exit 1;; esac
          arches=$(go run ./cmd/openweir-release arches "$FORMAT")
          . packaging/openwrt/retry.sh
          retry bounded 900 docker pull --quiet "ghcr.io/openwrt/sdk:x86_64-$sdk"
          # Four SDK builds at a time, one per runner core. Each writes its own log, shown
          # below in architecture order.
          logs=$RUNNER_TEMP/package-logs
          mkdir -p "$logs"
          status=0
          printf '%s\n' $arches | xargs -P 4 -I '{}' sh -c \
            'OPENWEIR_PACKAGE_ARCH=$1 packaging/openwrt/build.sh "$2" x86_64 "$3" "dist/feed/$1" >"$4/$1.log" 2>&1 || { echo "::error::$1 package build failed"; exit 1; }' \
            sh '{}' "$sdk" "$(cat VERSION)" "$logs" || status=$?
          for arch in $arches; do
            echo "::group::$arch"
            cat "$logs/$arch.log" 2>/dev/null || echo "no log"
            echo "::endgroup::"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        with:
          name: test-feed-${{ inputs.format }}
          # The install tests use the release packages only; previews go out separately below.
          path: |
            dist/feed/
            !dist/feed/*/preview/
          if-no-files-found: error
          retention-days: 3
      - name: Isolate the tested installers for publication
        env:
          FORMAT: ${{ inputs.format }}
          REVISION: ${{ steps.preview.outputs.revision }}
        run: |
          set -eu
          mkdir -p dist/release
          version=$(cat VERSION)-r$REVISION
          for arch in $(go run ./cmd/openweir-release arches "$FORMAT"); do
            name=$(go run ./cmd/openweir-release package-name "$version" "$FORMAT" "$arch")
            (cd "dist/feed/$arch" && grep -F "  $name" SHA256SUMS | sha256sum --check -)
            cp "dist/feed/$arch/$name" dist/release/
          done
          (cd dist/release && sha256sum -- * > ../release-sums && mv ../release-sums SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-installer-${{ inputs.format }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Isolate the preview installers
        if: steps.preview.outputs.number != ''
        env:
          FORMAT: ${{ inputs.format }}
          NUMBER: ${{ steps.preview.outputs.number }}
        run: |
          set -eu
          mkdir -p dist/preview
          version=$(cat VERSION)-r$NUMBER
          for arch in $(go run ./cmd/openweir-release arches "$FORMAT"); do
            name=$(go run ./cmd/openweir-release package-name "$version" "$FORMAT" "$arch")
            (cd "dist/feed/$arch/preview" && grep -F "  $name" SHA256SUMS | sha256sum --check -)
            cp "dist/feed/$arch/preview/$name" dist/preview/
          done
          (cd dist/preview && sha256sum -- * > ../preview-sums && mv ../preview-sums SHA256SUMS)
          echo "$NUMBER" > dist/preview-number
      - uses: actions/upload-artifact@v7
        if: steps.preview.outputs.number != ''
        with:
          name: preview-installer-${{ inputs.format }}
          path: |
            dist/preview/
            dist/preview-number
          if-no-files-found: error
          retention-days: 14
      - id: targets
        env:
          FORMAT: ${{ inputs.format }}
        run: echo "matrix=$(go run ./cmd/openweir-release matrix --format "$FORMAT")" >> "$GITHUB_OUTPUT"

  install:
    name: ${{ matrix.arch }} / ${{ matrix.firmware }}
    needs: build
    runs-on: ubuntu-latest
    # Runs take up to five minutes under emulation; the bound leaves room for retried downloads.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: test-feed-${{ inputs.format }}
          path: dist/feed
      - name: Enable target execution including MIPS32 and LoongArch
        run: |
          . packaging/openwrt/retry.sh
          apt_install() { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-user-binfmt; }
          retry apt_install
          sudo systemctl restart systemd-binfmt
          for arch in aarch64 arm mips mipsel riscv64 loongarch64; do
            grep -Eq '^flags: [A-Z]*F' "/proc/sys/fs/binfmt_misc/qemu-$arch"
          done
          if [ "${{ matrix.arch }}" = i386_pentium4 ]; then
            # Go uses the i386 socketcall ABI, which hosted amd64 containers filter.
            sudo /usr/lib/systemd/systemd-binfmt /usr/share/qemu/binfmt.d/qemu-i386.conf
            grep -Eq '^flags: [A-Z]*F' /proc/sys/fs/binfmt_misc/qemu-i386
          fi
      - name: Install offline, verify the Release update and uninstall
        run: packaging/openwrt/install-test.sh "${{ matrix.firmware }}" "${{ matrix.arch }}" "dist/feed/${{ matrix.arch }}"
