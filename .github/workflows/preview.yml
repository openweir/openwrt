# Previews as GitHub pre-releases: after Router service CI passes on a push to develop, its
# installers go out as v<VERSION>-preview.<N> (N counts from 1 per version) with package version
# <VERSION>_pre<N>, so testers download them from
# the release page instead of Actions artifacts. main holds what is to be released and makes the
# releases (prepare-release.yml). The router's package updater skips pre-releases
# (packaging/openwrt/package-update), and only the newest preview is kept.
name: Publish OpenWrt preview
on:
  workflow_run:
    workflows: [Router service CI]
    branches: [develop]
    types: [completed]
permissions:
  contents: write
  actions: write

# A newer develop commit supersedes the preview being published.
concurrency:
  group: openwrt-preview
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Skip a run that develop has moved past
        id: current
        run: |
          set -euo pipefail
          develop=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main" == "$HEAD_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main is at this commit; the release covers it, so no preview." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$develop" == "$HEAD_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A later develop commit has superseded this CI run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.publish == 'true'
        with:
          pattern: preview-installer-*
          path: dist/preview
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify both tested installers
        if: steps.current.outputs.publish == 'true'
        id: files
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          # A preview must sort after the newest release: once v<VERSION> is published,
          # develop has to move VERSION to the next version first.
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null | grep -qx false; then
            echo "::error::v$version is already released; bump VERSION on develop so previews sort after it."
            exit 1
          fi
          # CI numbered this preview when it built the packages (1.0.0_pre<N>); both formats agree.
          number=$(cat dist/preview/preview-installer-ipk/preview-number)
          test "$number" = "$(cat dist/preview/preview-installer-apk/preview-number)"
          case "$number" in [1-9]|[1-9][0-9]|[1-9][0-9][0-9]|[1-9][0-9][0-9][0-9]) ;; *) exit 1;; esac
          tag=v$version-preview.$number
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; a newer run will publish the next preview." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p dist/tested
          for format in ipk apk; do
            mv "dist/preview/preview-installer-$format/preview" "dist/tested/release-installer-$format"
          done
          go run ./cmd/openweir-release assets "${version}_pre$number" dist/tested dist/assets
          (cd dist/assets && sha256sum --check ../SHA256SUMS)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version-preview.$number" >> "$GITHUB_OUTPUT"
      - name: Publish the pre-release
        if: steps.current.outputs.publish == 'true'
        env:
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          # The same notes as a stable release, linking this preview's tag and naming its caveats.
          go run ./cmd/openweir-release notes --preview-tag "$TAG" --commit "$HEAD_SHA" \
            "$GITHUB_REPOSITORY" "$(cat VERSION)" dist/assets > notes.md
          gh release create "$TAG" dist/assets/* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
      # Only the newest preview stays; the older ones go, with their tags.
      - name: Remove older previews
        if: steps.current.outputs.publish == 'true'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.+-preview\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
      # Runs cancelled by a newer push only clutter the Actions list.
      - name: Delete cancelled runs
        if: always()
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --status cancelled --limit 100 --json databaseId --jq '.[].databaseId' |
          while read -r id; do
            gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
