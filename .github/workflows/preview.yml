# Previews as GitHub pre-releases: the last job of Router service CI on a push to develop calls
# this, so the publishing steps always come from the same commit as the packages. Installers go
# out as v<VERSION>-preview.<N> with package version <VERSION>-r<N> (N counts from 1 per version);
# the release then takes the next revision, so each build upgrades the one before it. The
# router's package updater skips pre-releases, and only the newest preview is kept.
name: Publish OpenWrt preview
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Use the version CI worked out
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION
      - name: Skip a run that develop has moved past
        id: current
        run: |
          set -euo pipefail
          develop=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main" == "$HEAD_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main is at this commit; the release covers it, so no preview." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$develop" == "$HEAD_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A later develop commit has superseded this CI run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.publish == 'true'
        with:
          pattern: preview-installer-*
          path: dist/preview
      - name: Verify both tested installers
        if: steps.current.outputs.publish == 'true'
        id: files
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          # A preview must sort after the newest release. CI computes VERSION from the release
          # tag in develop's history and the commits after it, so this only trips when develop
          # lacks what main released.
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null | grep -qx false; then
            echo "::error::v$version is already released; merge main into develop so the next version is computed past it."
            exit 1
          fi
          # CI numbered this preview when it built the packages (version-r<N>); both formats agree.
          number=$(cat dist/preview/preview-installer-ipk/preview-number)
          test "$number" = "$(cat dist/preview/preview-installer-apk/preview-number)"
          case "$number" in [1-9]|[1-9][0-9]|[1-9][0-9][0-9]|[1-9][0-9][0-9][0-9]) ;; *) exit 1;; esac
          tag=v$version-preview.$number
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; a newer run will publish the next preview." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p dist/tested
          for format in ipk apk; do
            mv "dist/preview/preview-installer-$format/preview" "dist/tested/release-installer-$format"
          done
          go run ./cmd/openweir-release assets "${version}-r$number" dist/tested dist/assets
          (cd dist/assets && sha256sum --check ../SHA256SUMS)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version-preview.$number" >> "$GITHUB_OUTPUT"
      - name: Publish the pre-release
        if: steps.current.outputs.publish == 'true'
        env:
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          # The same notes as a stable release, linking this preview's tag and naming its caveats.
          go run ./cmd/openweir-release notes --preview-tag "$TAG" --commit "$HEAD_SHA" \
            "$GITHUB_REPOSITORY" "$(cat VERSION)" dist/assets > notes.md
          gh release create "$TAG" dist/assets/* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
      # Only the newest preview stays; the older ones go, with their tags. A release's createdAt
      # is its commit's date, so after develop is reset to an older commit the new preview would
      # count as old: order by publishedAt, and never delete the preview this run published.
      - name: Remove older previews
        if: steps.current.outputs.publish == 'true'
        env:
          TAG: ${{ steps.files.outputs.tag }}
        run: |
          test -n "$TAG"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.+-preview\\.[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[1:] | .[].tagName | select(. != env.TAG)' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
      # Runs cancelled by a newer push only clutter the Actions list.
      - name: Delete cancelled runs
        if: always()
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --status cancelled --limit 100 --json databaseId --jq '.[].databaseId' |
          while read -r id; do
            gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
