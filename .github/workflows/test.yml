name: Router service CI
# Pushes run only for the two long-lived branches, which publish (develop a preview, main a
# release), and for release tags (the release job below); any other branch is checked through
# its pull request, so it does not run twice. workflow_dispatch runs any branch on demand.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch cancels the older run; main always runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # main and develop often point at one commit after a release; main's run covers it, so the
  # develop run skips every check and the preview workflow publishes nothing.
  # The version and the package revisions are worked out here once, so every job builds and
  # publishes the same ones.
  # Every job here has a timeout of two to three times its usual length, or more where a
  # retried download needs room for its attempts, so a hang fails in minutes instead of
  # GitHub's six hours. A job that calls another workflow cannot take one; its limits belong
  # on the called workflow's own jobs.
  gate:
    runs-on: ubuntu-latest
    # A few API calls and one small Go program. Each call is bounded at two minutes an attempt,
    # so a stall takes about 11 minutes, four attempts and their pauses (see bounded in
    # packaging/openwrt/retry.sh), before it fails.
    timeout-minutes: 15
    outputs:
      run: ${{ steps.same.outputs.run }}
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.number.outputs.preview }}
      revision: ${{ steps.number.outputs.revision }}
    steps:
      # Checked out first, even for a run that skips, for the retry helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: same
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . packaging/openwrt/retry.sh
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/develop ]; then
            # Each attempt rewrites the file, so it never keeps a failed attempt's error body.
            main_sha() { bounded 120 gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha > "$RUNNER_TEMP/main-sha"; }
            retry main_sha
            if [ "$(cat "$RUNNER_TEMP/main-sha")" = "$GITHUB_SHA" ]; then
              run=false
              echo "main is at this commit; its CI run covers it." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.same.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Version from tags and conventional commits
        id: version
        if: steps.same.outputs.run == 'true'
        run: |
          version=$(go run ./cmd/openweir-release next-version)
          go run ./cmd/openweir-release version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
      # Package revisions count up within a version: a push to develop builds preview N as
      # version-rN, and main builds the release as the next revision after the last preview,
      # so every build upgrades the one before it. Both package formats take these numbers, so
      # a preview published while they build cannot number them apart.
      - name: Number the preview and the release revision
        id: number
        if: steps.same.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          . packaging/openwrt/retry.sh
          last=$(retry bounded 120 gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v$VERSION-preview.\")) | ltrimstr(\"v$VERSION-preview.\") | select(test(\"^[0-9]+\$\")) | tonumber] | max // 0")
          if [ "$DEVELOP" = true ]; then echo "preview=$((last + 1))" >> "$GITHUB_OUTPUT"; fi
          echo "revision=$((last + 1))" >> "$GITHUB_OUTPUT"
  core:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Router configuration and authenticated mihomo controller
    runs-on: ubuntu-24.04-arm
    # Minutes with the cached core; a cache miss first builds mihomo, about ten more. A stalled
    # release lookup or download is retried for about 11 (see the gate).
    timeout-minutes: 30
    env:
      # The released kernel the loopback tests run against: openweir-v1.0.1.
      MIHOMO_REF: 8d0770267d54c47e8ec72250ff8a5bb0be997269
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The pinned core only changes with its commit or the Go toolchain.
      - id: core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mihomo
          key: mihomo-linux-arm64-${{ env.MIHOMO_REF }}-${{ hashFiles('go.mod') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          repository: openweir/mihomo
          ref: ${{ env.MIHOMO_REF }}
          path: .ci-mihomo
          persist-credentials: false
      - name: Build the pinned Linux core
        if: steps.core-cache.outputs.cache-hit != 'true'
        working-directory: .ci-mihomo
        run: CGO_ENABLED=0 go build -trimpath -tags with_gvisor -o "$RUNNER_TEMP/mihomo" .
      - name: Exercise the real core on loopback
        run: |
          go test -c -o "$RUNNER_TEMP/router.test" ./internal/router
          go test -c -o "$RUNNER_TEMP/control.test" ./internal/control
          sudo unshare --net sh -ec '
            ip link set lo up
            export OPENWEIR_MIHOMO_TEST_CORE="$1/mihomo"
            export OPENWEIR_DIAGNOSTIC_CORE="$1/mihomo" OPENWEIR_TEST_CORE="$1/mihomo"
            "$1/control.test" -test.v -test.run "^TestMihomoController$"
            "$1/router.test" -test.v -test.run "^Test(UpstreamCoreControl|WireSharedOutbound)$"
          ' sh "$RUNNER_TEMP"
      # The source job is not root, so these tests skip there. The runner's root holds every
      # capability, as procd's does on a router: OPENWEIR_CORE_FIXTURE=1 makes the launch test
      # require the core's open-file limit instead of tolerating a container that lacks
      # CAP_SYS_RESOURCE. The launch and reclaim tests must pass, not skip; the nft check
      # skips where the runner has no nft.
      - name: Launch the core as root and reclaim another account's state
        run: |
          sudo unshare --net sh -ec '
            ip link set lo up
            OPENWEIR_CORE_FIXTURE=1 "$1/router.test" -test.v \
              -test.run "^Test(CoreLaunchHoldsEveryCapability|ReclaimDirKeepsOwnStateAndDropsForeign|NFTableGoneAnswersOnlyForACertainlyMissingTable)$" \
              > "$1/root.log" || { cat "$1/root.log"; exit 1; }
            cat "$1/root.log"
            for test in CoreLaunchHoldsEveryCapability ReclaimDirKeepsOwnStateAndDropsForeign; do
              grep -q "^--- PASS: Test$test " "$1/root.log" || { echo "::error::Test$test did not run as root"; exit 1; }
            done
          ' sh "$RUNNER_TEMP"
      - name: Install the publisher's latest stable ARM64 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . packaging/openwrt/retry.sh
          # openweir/mihomo releases stable kernels as openweir-vX.Y.Z from its Alpha branch
          # (upstream Alpha plus OpenWeir's commits); upstream's own Build workflow there also
          # publishes a Prerelease-Alpha, which is not an openweir-v tag and is never latest.
          # Each attempt rewrites the file, so it never keeps a failed attempt's error body.
          latest() { bounded 120 gh api repos/openweir/mihomo/releases/latest > "$RUNNER_TEMP/release.json"; }
          retry latest
          tag=$(jq -er '.tag_name | select(test("^openweir-v[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$RUNNER_TEMP/release.json")
          name="mihomo-linux-arm64-$tag.gz"
          digest=$(jq -er --arg name "$name" '
            [.assets[] | select(.name == $name)] | select(length == 1) | .[0].digest |
            capture("^sha256:(?<hash>[0-9a-f]{64})$").hash
          ' "$RUNNER_TEMP/release.json")
          # --clobber: a retry replaces what a failed attempt left; the test checks the digest.
          retry bounded 120 gh release download "$tag" --repo openweir/mihomo --pattern "$name" --dir "$RUNNER_TEMP" --clobber
          export OPENWEIR_RELEASE_TEST_ARCHIVE="$RUNNER_TEMP/$name"
          export OPENWEIR_RELEASE_TEST_TAG="$tag" OPENWEIR_RELEASE_TEST_SHA256="$digest"
          go test -count=1 -run '^TestPublishedARM64Archive$' ./internal/kernel
  browser:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: LuCI navigation and interactions
    runs-on: ubuntu-latest
    # Mostly installing Chromium's system libraries; the checks themselves take a few minutes.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: 1.62.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The browser download is reused; its system libraries are still installed every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/ui" --no-save "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/ui/node_modules/.bin/playwright" install --with-deps chromium
      - run: OPENWEIR_PLAYWRIGHT="$RUNNER_TEMP/ui/node_modules/playwright/index.mjs" node scripts/qualification/ui/check.mjs
  source:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The race-enabled tests of every package are the slow part. This leaves room for go
    # test's own 10-minute limit per package to fire first and print the hung goroutines.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check router shell scripts
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --shell=busybox --severity=warning --external-sources --check-sourced \
            --source-path=SCRIPTDIR files/usr/libexec/openweir/network \
            files/usr/libexec/openweir/procd-delete files/usr/libexec/rpcd/openweir \
            files/etc/init.d/openweir files/etc/hotplug.d/*/*-openweir \
            packaging/openwrt/{activate-runtime,runtime-abi,package-update,package-recovery}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  runtime:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Build offline management runtime / ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [amd64, '386', arm64, arm5, arm6, arm7, mips, mipsle, riscv64, loong64]
    runs-on: ubuntu-latest
    # One cross-compiled Go program per ABI.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Cross-compile the bundled management commands
        env:
          OPENWEIR_MIHOMO_PUBLIC_KEY: ${{ vars.MIHOMO_PUBLISHER_KEY }}
          ABI: ${{ matrix.abi }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/openwrt/build-runtime.sh "$ABI" "$VERSION" dist/runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.abi }}
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 7
  # Packaging needs only the runtimes, so it runs beside the tests; nothing is published
  # until every check has passed.
  ipk:
    name: Universal IPK
    needs: [gate, runtime]
    uses: ./.github/workflows/package-format.yml
    with:
      format: ipk
      version: ${{ needs.gate.outputs.version }}
      preview: ${{ needs.gate.outputs.preview }}
      revision: ${{ needs.gate.outputs.revision }}
  apk:
    name: Universal APK
    needs: [gate, runtime]
    uses: ./.github/workflows/package-format.yml
    with:
      format: apk
      version: ${{ needs.gate.outputs.version }}
      preview: ${{ needs.gate.outputs.preview }}
      revision: ${{ needs.gate.outputs.revision }}
  # Publishing runs as part of this workflow, so it uses this commit's workflow files and the
  # packages this run tested (a workflow_run trigger would run main's copy instead).
  preview:
    name: Publish preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [gate, source, core, browser, ipk, apk]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/preview.yml
    with:
      version: ${{ needs.gate.outputs.version }}
  release:
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [gate, source, core, browser, ipk, apk]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/prepare-release.yml
    with:
      version: ${{ needs.gate.outputs.version }}
